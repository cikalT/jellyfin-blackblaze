# Dipasang ke /etc/systemd/system/docker.service.d/10-after-deps.conf
#
# Docker punya dua dependensi yang harus siap sebelum daemon-nya start:
#
# 1. rclone-b2.service — Docker me-restart container ber-policy
#    `unless-stopped` saat daemon start. Saat boot itu terjadi SEBELUM rclone
#    sempat memasang mount, sehingga Jellyfin melihat /srv/media kosong dan
#    mengira seluruh library terhapus.
#
# 2. wg-quick@wg0.service — Jellyfin bind ke alamat WireGuard. Kalau
#    interface wg0 belum ada, Docker gagal mem-publish port dan container
#    tidak mau start sama sekali.
#
# Efek samping yang disengaja: kalau salah satu gagal, Docker tidak start.
# Lebih baik tidak ada Jellyfin daripada Jellyfin dengan library kosong atau
# yang mendengar di alamat yang salah.
[Unit]
After=rclone-b2.service wg-quick@wg0.service
Requires=rclone-b2.service wg-quick@wg0.service
